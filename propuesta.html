    // =============================================
    // PRICE HELPERS
    // =============================================
    function formatPrice(num) {
      return num.toLocaleString('es-ES');
    }

    function getAdjustedPrice(basePrice) {
      return Math.round(basePrice * (1 + proposalState.globalMargin / 100));
    }

    // =============================================
    // PRICE EDITING
    // =============================================
    // =============================================
    // SHOW PICKER — add shows in admin mode
    // =============================================
    let pickerFilter = 'all';
    let pickerQuery = '';

    function openPicker() {
      pickerFilter = 'all';
      pickerQuery = '';
      const searchEl = document.getElementById('pickerSearch');
      if (searchEl) {
        searchEl.value = '';
        searchEl.oninput = (e) => {
          pickerQuery = (e.target.value || '').trim().toLowerCase();
          renderPickerGrid();
        };
      }
      renderPickerTabs();
      renderPickerGrid();
      document.getElementById('pickerOverlay').classList.add('open');
      if (searchEl) setTimeout(() => searchEl.focus(), 50);
    }

    function closePicker() {
      document.getElementById('pickerOverlay').classList.remove('open');
    }

    function renderPickerTabs() {
      const catLabels = { all: 'Todos', danza: 'Danza', musica: 'Música', circo: 'Circo', wow: 'WOW' };
      const tabs = document.getElementById('pickerTabs');
      tabs.innerHTML = Object.entries(catLabels).map(([key, label]) =>
        `<button class="picker-tab ${pickerFilter === key ? 'active' : ''}" onclick="filterPicker('${key}')">${label}</button>`
      ).join('');
    }

    function filterPicker(cat) {
      pickerFilter = cat;
      renderPickerTabs();
      renderPickerGrid();
    }

    function _pickerEscape(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function renderPickerGrid() {
      const grid = document.getElementById('pickerGrid');
      const currentIds = proposalState.shows.map(s => s.id);
      const catLabels = { danza: 'Danza', musica: 'Música', circo: 'Circo', wow: 'WOW' };
      const PLACEHOLDER_IMG = 'https://via.placeholder.com/400x200?text=Sin+imagen';

      const q = pickerQuery;
      const groups = new Map();
      const favorites = [];
      Object.entries(SHOW_CATALOG).forEach(([id, show]) => {
        if (!show) return;
        if (pickerFilter !== 'all' && show.category !== pickerFilter) return;
        if (q) {
          const hay = [
            show.name, show.nameEn, show.subcategory, show.subcategoryEn, show.category,
            catLabels[show.category], show.artistaNombre,
            show.description, show.descriptionEn
          ].filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(q)) return;
        }
        if (show.isFavorite) favorites.push({ id, show });
        const key = show.artistaId || '__none__';
        if (!groups.has(key)) {
          groups.set(key, {
            artistaId: show.artistaId || null,
            artistaNombre: show.artistaNombre || '',
            artistaFotos: Array.isArray(show.artistaFotos) ? show.artistaFotos : [],
            shows: []
          });
        }
        groups.get(key).shows.push({ id, show });
      });

      if (groups.size === 0) {
        const msg = pickerQuery
          ? `Sin resultados para "${_pickerEscape(pickerQuery)}".`
          : 'No hay shows disponibles en esta categoria.';
        grid.innerHTML = `<div style="padding:32px;text-align:center;color:var(--gray);font-family:Inter,sans-serif;">${msg}</div>`;
        return;
      }

      const orderedKeys = Array.from(groups.keys()).sort((a, b) => {
        if (a === '__none__') return 1;
        if (b === '__none__') return -1;
        const na = (groups.get(a).artistaNombre || '').toLowerCase();
        const nb = (groups.get(b).artistaNombre || '').toLowerCase();
        return na.localeCompare(nb);
      });

      const renderShowCard = (id, show) => {
        const already = currentIds.includes(id);
        const safeId = _pickerEscape(id);
        const name = show.name || '(sin nombre)';
        const cat = catLabels[show.category] || show.category || '';
        const sub = show.subcategory || '';
        const meta = [cat, sub].filter(Boolean).join(' · ');
        const img = show.imageUrl || PLACEHOLDER_IMG;
        const star = show.isFavorite ? '<span class="picker-fav-star" title="Favorito">★</span>' : '';
        return `
          <div class="picker-card ${already ? 'already-added' : ''}" onclick="${already ? '' : `addShowFromPicker('${safeId}')`}">
            <img src="${_pickerEscape(img)}" alt="${_pickerEscape(name)}" loading="lazy" onerror="this.onerror=null;this.src='${PLACEHOLDER_IMG}';">
            <div class="picker-card-body">
              <small>${_pickerEscape(meta)}</small>
              <h4>${star}${_pickerEscape(name)}${already ? ' (agregado)' : ''}</h4>
            </div>
          </div>`;
      };

      let html = '';

      if (favorites.length) {
        const favCards = favorites.map(({ id, show }) => renderShowCard(id, show)).join('');
        html += `
          <section class="picker-artist-section picker-favorites-section">
            <header class="picker-artist-header">
              <div class="picker-artist-avatar picker-artist-avatar--star">★</div>
              <div class="picker-artist-meta">
                <h3>Favoritos</h3>
                <span>${favorites.length} show${favorites.length === 1 ? '' : 's'}</span>
              </div>
            </header>
            <div class="picker-artist-grid">${favCards}</div>
          </section>`;
      }

      orderedKeys.forEach(key => {
        const g = groups.get(key);
        const artistLabel = key === '__none__'
          ? 'Sin artista asignado'
          : (g.artistaNombre || 'Artista sin nombre');
        const photo = (g.artistaFotos && g.artistaFotos[0]) ? g.artistaFotos[0] : '';
        const initial = (artistLabel.trim()[0] || '?').toUpperCase();
        const avatar = photo
          ? `<div class="picker-artist-avatar" style="background-image:url('${_pickerEscape(photo)}')"></div>`
          : `<div class="picker-artist-avatar picker-artist-avatar--initial">${_pickerEscape(initial)}</div>`;

        const sortedShows = [...g.shows].sort((a, b) => {
          const fa = a.show.isFavorite ? 1 : 0;
          const fb = b.show.isFavorite ? 1 : 0;
          if (fa !== fb) return fb - fa;
          return (a.show.name || '').localeCompare(b.show.name || '');
        });
        const cards = sortedShows.map(({ id, show }) => renderShowCard(id, show)).join('');

        html += `
          <section class="picker-artist-section">
            <header class="picker-artist-header">
              ${avatar}
              <div class="picker-artist-meta">
                <h3>${_pickerEscape(artistLabel)}</h3>
                <span>${g.shows.length} show${g.shows.length === 1 ? '' : 's'}</span>
              </div>
            </header>
            <div class="picker-artist-grid">${cards}</div>
          </section>`;
      });
      grid.innerHTML = html;
    }

    function addShowFromPicker(id) {
      const show = SHOW_CATALOG[id];
      if (!show) return;

      proposalState.shows.push({
        ...show,
        id: id,
        currentPrice: show.basePrice,
        contextLabel: show.subcategory,
        extras: []
      });

      closePicker();
      renderProposal();
      if (proposalState.isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
      }
      showToast('Agregado: ' + show.name, 'success');

      // Scroll to the new block
      setTimeout(() => {
        const blocks = document.querySelectorAll('.block');
        const last = blocks[blocks.length - 1];
        if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }

    function removeShow(index) {
      const show = proposalState.shows[index];
      if (!show) return;
      proposalState.shows.splice(index, 1);
      renderProposal();
      if (proposalState.isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
      }
      showToast('Eliminado: ' + show.name);
    }

    function toggleSummary() {
      proposalState.hideSummary = !proposalState.hideSummary;
      renderProposal();
      if (proposalState.isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
      }
      showToast(proposalState.hideSummary ? 'Resumen de presupuesto ocultado' : 'Resumen de presupuesto visible');
    }


    // =============================================
    // CONDICIONES editables (admin mode)
    // =============================================
    // Si la propuesta tiene `conditions` custom, las usa; si no, default del I18N.
    // Xavi adapta texto/orden/cantidad por cliente. Se persisten en save-proposal.
    // Detecta si un array de condiciones es EXACTAMENTE el default (ES o EN) sin
    // tocar: en ese caso NO es "custom" y debe renderizarse/guardarse según idioma.
    // Corrige el bug de propuestas EN que mostraban condiciones en español (el
    // flush de edición snapshotaba T.conditions del idioma del builder = ES).
    // Normaliza texto para comparación tolerante: colapsa espacios, minúsculas,
    // sin puntuación final. Sobrevive a espacios extra, mayúsculas raras y
    // ediciones triviales que antes hacían fallar el matching estricto.
    function normCondText(s) {
      return String(s == null ? '' : s).toLowerCase().replace(/\s+/g,' ').replace(/[.,;:!?]+$/,'').trim();
    }
    function conditionsAreDefaultText(arr) {
      if (!Array.isArray(arr)) return false;
      const norm = a => JSON.stringify((a || []).map(normCondText));
      const t = norm(arr);
      return t === norm(I18N.es.conditions) || t === norm(I18N.en.conditions);
    }
    // Detecta si N% del array coincide con el default del otro idioma (bug idioma mixto).
    // Xavi 2026-08-28: propuestas ES que muestran condiciones EN (o viceversa) porque
    // el snapshot del builder guardó el idioma erróneo. Umbral 60% de items matcheando
    // el otro idioma → asumimos que están en el otro y devolvemos el default del actual.
    function conditionsAreInOppositeLang(arr) {
      if (!Array.isArray(arr) || !arr.length) return false;
      const oppositeLang = (LANG === 'es') ? 'en' : 'es';
      const oppDefaults = (I18N[oppositeLang].conditions || []).map(normCondText);
      const matches = arr.filter(c => oppDefaults.includes(normCondText(c))).length;
      return matches / arr.length >= 0.6;
    }
    // Condiciones a persistir: solo si son realmente custom; si coinciden con el
    // default de cualquier idioma, se guarda null para que el render use el del idioma.
    function getPersistableConditions() {
      return (Array.isArray(proposalState.conditions) && !conditionsAreDefaultText(proposalState.conditions) && !conditionsAreInOppositeLang(proposalState.conditions))
        ? proposalState.conditions : null;
    }
    function getActiveConditions() {
      if (Array.isArray(proposalState.conditions)
          && !conditionsAreDefaultText(proposalState.conditions)
          && !conditionsAreInOppositeLang(proposalState.conditions)) {
        return proposalState.conditions;
      }
      return T.conditions;
    }
    function escapeHtmlText(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function ensureConditionsArr() {
      if (!Array.isArray(proposalState.conditions)) {
        proposalState.conditions = [...T.conditions];
      }
    }
    function updateCondition(i, el) {
      ensureConditionsArr();
      const txt = (el.innerText || el.textContent || '').trim();
      proposalState.conditions[i] = txt;
      if (proposalState.isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
      }
    }
    function removeCondition(i) {
      ensureConditionsArr();
      proposalState.conditions.splice(i, 1);
      renderProposal();
      if (proposalState.isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
      }
    }
    function addCondition() {
      ensureConditionsArr();
      proposalState.conditions.push('Nueva condición — haz click para editar');
      renderProposal();
      if (proposalState.isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
        // Focus en la nueva
        setTimeout(() => {
          const items = document.querySelectorAll('#conditionsList [contenteditable]');
          const last = items[items.length - 1];
          if (last) {
            last.focus();
            const range = document.createRange();
            range.selectNodeContents(last);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          }
        }, 30);
      }
    }

    // =============================================
    // CAROUSEL (multi-imagen por show)
    // =============================================
    const _carouselTimers = new Map(); // blockIndex -> setInterval id
    const _carouselState = new Map();  // blockIndex -> { current, total }

    function carouselGoto(blockIndex, slideIndex) {
      const root = document.querySelector(`[data-carousel-index="${blockIndex}"]`);
      if (!root) return;
      const slides = root.querySelectorAll('.carousel-slide');
      const dots = root.querySelectorAll('.carousel-dot');
      if (!slides.length) return;
      const next = ((slideIndex % slides.length) + slides.length) % slides.length;
      slides.forEach((s, k) => s.classList.toggle('active', k === next));
      dots.forEach((d, k) => d.classList.toggle('active', k === next));
      _carouselState.set(blockIndex, { current: next, total: slides.length });
    }

    function carouselStep(blockIndex, dir) {
      const st = _carouselState.get(blockIndex) || { current: 0 };
      carouselGoto(blockIndex, st.current + dir);
      // Reinicia el timer cuando el usuario interactúa — evita salto inmediato.
      startCarouselAutoplay(blockIndex);
    }

    function startCarouselAutoplay(blockIndex) {
      const prev = _carouselTimers.get(blockIndex);
      if (prev) clearInterval(prev);
      const root = document.querySelector(`[data-carousel-index="${blockIndex}"]`);
      if (!root) return;
      const total = root.querySelectorAll('.carousel-slide').length;
      if (total < 2) return;
      const id = setInterval(() => {
        const st = _carouselState.get(blockIndex) || { current: 0 };
        carouselGoto(blockIndex, st.current + 1);
      }, 5000);
      _carouselTimers.set(blockIndex, id);
    }

    function initCarousels() {
      // Limpia timers viejos al re-renderizar la propuesta.
      _carouselTimers.forEach(id => clearInterval(id));
      _carouselTimers.clear();
      _carouselState.clear();
      document.querySelectorAll('[data-carousel-index]').forEach(root => {
        const idx = parseInt(root.dataset.carouselIndex, 10);
        const total = root.querySelectorAll('.carousel-slide').length;
        _carouselState.set(idx, { current: 0, total });
        startCarouselAutoplay(idx);
      });
    }

    // =============================================
    // PRICE NOTE EDIT (inline)
    // =============================================
    function updatePriceNote(index, el) {
      if (!proposalState.isAdmin) return;
      const show = proposalState.shows[index];
      if (!show) return;
      const next = (el.textContent || '').trim();
      if (next === (show.priceNote || '').trim()) return;
      show.priceNote = next;
      // Re-render solo el summary (los bloques ya muestran el texto nuevo);
      // un renderProposal completo descartaría el foco si el usuario
      // siguiera escribiendo, pero ya hicimos blur así que es seguro.
      renderProposal();
      showToast('Detalle de precio actualizado');
    }

    // =============================================
    // EXTRA COST LINES per show (vestuario, horas extra, transporte…)
    // =============================================
    function addExtra(showIndex) {
      if (!proposalState.isAdmin) return;
      const show = proposalState.shows[showIndex];
      if (!show) return;
      if (!Array.isArray(show.extras)) show.extras = [];
      show.extras.push({ label: 'Vestuario', amount: 0 });
      renderProposal();
    }

    function updateExtraLabel(showIndex, extraIndex, el) {
      if (!proposalState.isAdmin) return;
      const show = proposalState.shows[showIndex];
      if (!show || !Array.isArray(show.extras) || !show.extras[extraIndex]) return;
      const next = (el.textContent || '').trim();
      if (next === (show.extras[extraIndex].label || '').trim()) return;
      show.extras[extraIndex].label = next;
      renderProposal();
    }

    function updateExtraAmount(showIndex, extraIndex, el) {
      if (!proposalState.isAdmin) return;
      const show = proposalState.shows[showIndex];
      if (!show || !Array.isArray(show.extras) || !show.extras[extraIndex]) return;
      // Acepta "1.500", "1500€", "1500.50" — quédate con dígitos.
      const text = (el.textContent || '').replace(/[^0-9]/g, '');
      const shown = parseInt(text, 10);
      if (!Number.isFinite(shown)) return;
      // Almacenar precio base sin margen (consistencia con startPriceEdit).
      const baseAmount = Math.round(shown / (1 + proposalState.globalMargin / 100));
      if (baseAmount === show.extras[extraIndex].amount) return;
      show.extras[extraIndex].amount = baseAmount;
      renderProposal();
    }

    function removeExtra(showIndex, extraIndex) {
      if (!proposalState.isAdmin) return;
      const show = proposalState.shows[showIndex];
      if (!show || !Array.isArray(show.extras)) return;
      show.extras.splice(extraIndex, 1);
      renderProposal();
    }

    // =============================================
    // HERO IMAGE PICKER
    // =============================================
    // Agrupa imágenes del catálogo por SHOW para que el picker no sea un
    // dump caótico. Devuelve { inProposal: [groups], rest: [groups] } donde
    // cada group = { showName, category?, urls: [...] } sin URLs duplicadas
    // entre grupos.
    function _heroPickerGroups() {
      const inProposalIds = new Set(proposalState.shows.map(s => s.id));
      const seen = new Set();
      const inProposal = [];
      const rest = [];
      const makeGroup = (show, id) => {
        const urls = Array.isArray(show.imageUrls) && show.imageUrls.length
          ? show.imageUrls
          : (show.imageUrl ? [show.imageUrl] : []);
        const fresh = urls.filter(u => u && !seen.has(u));
        fresh.forEach(u => seen.add(u));
        if (!fresh.length) return null;
        return { showName: show.name || id, category: show.category || '', subcategory: show.subcategory || '', urls: fresh };
      };
      proposalState.shows.forEach(show => {
        const g = makeGroup(show, show.id);
        if (g) inProposal.push(g);
      });
      if (typeof SHOW_CATALOG === 'object' && SHOW_CATALOG) {
        Object.entries(SHOW_CATALOG).forEach(([id, show]) => {
          if (inProposalIds.has(id)) return;
          const g = makeGroup(show, id);
          if (g) rest.push(g);
        });
      }
      return { inProposal, rest };
    }

    function openHeroImagePicker() {
      if (!proposalState.isAdmin) return;
      const groups = _heroPickerGroups();
      // Aplanado paralelo a la vista: cada tile guarda su índice global aquí
      // para que selectHeroImageByIndex pueda recuperar la URL sin DOM-walking.
      const flat = [];
      groups.inProposal.forEach(g => g.urls.forEach(u => flat.push(u)));
      groups.rest.forEach(g => g.urls.forEach(u => flat.push(u)));
      proposalState._heroPickerCandidates = flat.map(url => ({ url }));
      proposalState._heroPickerGroups = groups;
      _renderHeroPicker('');
      const search = document.getElementById('heroImageSearch');
      if (search) {
        search.value = '';
        search.oninput = (e) => _renderHeroPicker(e.target.value);
      }
      document.getElementById('heroImagePickerOverlay').classList.add('open');
    }

    function _renderHeroPicker(query) {
      const q = (query || '').trim().toLowerCase();
      const groups = proposalState._heroPickerGroups || { inProposal: [], rest: [] };
      const current = proposalState.heroImageUrl;
      const flat = proposalState._heroPickerCandidates || [];

      // Filtro por nombre de show / subcategoría
      const matches = (g) => !q
        || g.showName.toLowerCase().includes(q)
        || (g.subcategory || '').toLowerCase().includes(q)
        || (g.category || '').toLowerCase().includes(q);
      const inProp = groups.inProposal.filter(matches);
      const rest = groups.rest.filter(matches);

      const tileIdx = (url) => flat.findIndex(c => c.url === url);
      const renderTile = (url) => {
        const idx = tileIdx(url);
        const selected = url === current ? 'selected' : '';
        return `<div class="hero-image-tile ${selected}" style="background-image:url('${url}')" onclick="selectHeroImageByIndex(${idx})"></div>`;
      };
      const renderGroup = (g) => `<div class="hero-show-group">
        <div class="hero-show-name">${g.showName}${g.subcategory ? `<small>${g.subcategory}</small>` : ''}</div>
        <div class="hero-show-tiles">${g.urls.map(renderTile).join('')}</div>
      </div>`;

      let html = '';
      if (!inProp.length && !rest.length) {
        html = `<p style="text-align:center;color:var(--gray);padding:30px;">${q ? 'Sin resultados para "' + query + '"' : 'Ningún show del catálogo tiene imágenes todavía.'}</p>`;
      } else {
        if (inProp.length) {
          html += `<div class="hero-section"><div class="hero-section-title">Shows de esta propuesta</div>`;
          html += inProp.map(renderGroup).join('');
          html += `</div>`;
        }
        if (rest.length) {
          html += `<div class="hero-section"><div class="hero-section-title">Resto del catálogo (${rest.length})</div>`;
          html += rest.map(renderGroup).join('');
          html += `</div>`;
        }
      }
      if (current) {
        html += `<button class="hero-image-reset" style="margin-top:14px;" onclick="selectHeroImageByIndex(-1)">Volver al valor por defecto (primera imagen del primer show)</button>`;
      }
      document.getElementById('heroImageGrid').innerHTML = html;
    }

    function closeHeroImagePicker() {
      document.getElementById('heroImagePickerOverlay').classList.remove('open');
    }

    function selectHeroImageByIndex(idx) {
      const candidates = proposalState._heroPickerCandidates || [];
      const url = idx < 0 ? null : (candidates[idx]?.url || null);
      proposalState.heroImageUrl = url;
      closeHeroImagePicker();
      renderProposal();
      if (proposalState.isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
      }
      showToast(url ? 'Imagen de cabecera actualizada' : 'Imagen de cabecera restablecida');
    }

    function startPriceEdit(el, index) {
      if (!proposalState.isAdmin) return;

      const show = proposalState.shows[index];
      const currentPrice = getAdjustedPrice(show.currentPrice);

      // Replace with input
      const input = document.createElement('input');
      input.type = 'number';
      input.className = 'price-input';
      input.value = currentPrice;
      input.setAttribute('data-index', index);

      input.addEventListener('blur', function() { finishPriceEdit(this, index); });
      input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') this.blur();
      });

      el.innerHTML = '';
      el.appendChild(input);
      el.appendChild(document.createElement('small'));
      el.querySelector('small').textContent = show.priceNote;
      input.focus();
      input.select();
    }

    function finishPriceEdit(input, index) {
      const newPrice = parseInt(input.value) || proposalState.shows[index].currentPrice;
      // Reverse the margin to store the base price
      proposalState.shows[index].currentPrice = Math.round(newPrice / (1 + proposalState.globalMargin / 100));
      renderProposal();
      showToast('Precio actualizado: ' + formatPrice(newPrice) + '\u20AC');
    }

    function updateGlobalMargin(value) {
      proposalState.globalMargin = parseInt(value);
      document.getElementById('marginValue').textContent = value + '%';
      renderProposal();
      // Re-show margin control after re-render
      const marginControl = document.getElementById('marginControl');
      if (marginControl) {
        marginControl.classList.add('visible');
        document.getElementById('marginSlider').value = value;
      }
    }

    // =============================================
    // ADMIN BAR
    // =============================================
    function updateAdminBar() {
      const dot = document.getElementById('statusDot');
      const status = document.getElementById('adminStatus');
      const meta = document.getElementById('adminMeta');

      const { client, event } = proposalState;

      switch (proposalState.status) {
        case 'revision':
          dot.className = 'status-dot';
          status.textContent = 'REVISION';
          break;
        case 'approved':
          dot.className = 'status-dot approved';
          status.textContent = 'APROBADA';
          break;
        case 'sent':
          dot.className = 'status-dot sent';
          status.textContent = 'ENVIADA';
          break;
      }

      meta.textContent = `${client.company} \u2014 ${event.type} \u2014 ${event.date}`;

      // Marca el lang actual en el toggle
      document.querySelectorAll('#langToggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === LANG);
      });

      // Si la propuesta est\u00e1 aprobada, congelar la edici\u00f3n: ocultar el bot\u00f3n
      // "Aprobar y enviar" (ya aprobada) y dejar el admin-bar con toggle ES/EN
      // + Exportar PDF \u00fanicamente. Spec Xavi 2026-05-29.
      const approveBtn = document.querySelector('.btn-admin.btn-approve');
      if (approveBtn) {
        approveBtn.style.display = (proposalState.status === 'approved') ? 'none' : '';
      }
    }

    // Cambia el idioma de la propuesta: persiste lang en Supabase si la
    // propuesta tiene id, y recarga con ?lang=. Si todav\u00eda no hay id
    // guardado (modo builder), solo recarga con el query.
    async function toggleProposalLang(target) {
      if (target !== 'es' && target !== 'en') return;
      if (target === LANG) return;

      // Camino ADMIN: persistir SIEMPRE antes de recargar. Si la propuesta aún
      // no existe (recién construida en el builder, sin proposalId),
      // saveProposalDraft la CREA y devuelve el id. Antes, sin proposalId, se
      // saltaba el guardado y la recarga mantenía mode=builder → volvía al
      // formulario vacío y se perdía TODO el trabajo. Ahora recargamos hacia la
      // propuesta guardada (?id=…&lang=…), nunca al builder vacío.
      if (proposalState.isAdmin) {
        try {
          flushPendingEditableEdits();
          const savedId = await saveProposalDraft(target);
          const params = new URLSearchParams(location.search);
          params.delete('mode');   // salir del builder / modo auto
          params.delete('data');
          params.set('id', savedId);
          params.set('lang', target);
          params.set('admin', '1');
          location.assign(`${location.pathname}?${params.toString()}${location.hash}`);
        } catch (e) {
          console.error('toggle lang save error:', e);
          // No recargar si el guardado falló: perderíamos el trabajo en memoria.
          if (typeof showToast === 'function') {
            showToast('No se pudo guardar antes de cambiar de idioma. Reintenta.', 'error');
          } else {
            alert('No se pudo guardar antes de cambiar de idioma. Reintenta.');
          }
        }
        return;
      }

      // Camino CLIENTE: solo cambia el idioma de visualización, sin guardar nada
      // ni exponer el modo edición (la propuesta ya está guardada por id).
      const params = new URLSearchParams(location.search);
      params.set('lang', target);
      location.assign(`${location.pathname}?${params.toString()}${location.hash}`);
    }

    // =============================================
    // CLIENT CONFIRMATION (público)
    // =============================================
    // Botón "Descargar PDF" para la vista CLIENTE de propuestas ya validadas.
    // Solo se renderiza si NO es admin (el admin ya tiene "Exportar PDF" en su
    // barra) y la propuesta está aprobada. Xavi 2026-07-17.
    function clientPdfBtn(cls) {
      if (proposalState.isAdmin || proposalState.showAdminBar) return '';
      if (proposalState.status !== 'approved') return '';
      return `<button class="btn-pdf-client ${cls || ''}" onclick="downloadProposalPdf(this)">${T.ctaDownloadPdf}</button>`;
    }

    // Descarga el PDF de la propuesta validada. Si ya se generó al validar
    // (pdf_url), abre ese directo. Si no existe (propuestas aprobadas viejas
    // sin PDF), lo genera on-demand y después lo abre.
    async function downloadProposalPdf(btn) {
      if (proposalState.pdfUrl) { window.open(proposalState.pdfUrl, '_blank'); return; }
      const orig = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = T.ctaPdfGenerating; }
      try {
        const r = await fetch('/api/generate-proposal-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proposalId: proposalState.proposalId, lang: LANG })
        });
        const d = await r.json();
        if (!r.ok || !d.url) throw new Error(d.error || 'PDF error');
        proposalState.pdfUrl = d.url;
        window.open(d.url, '_blank');
      } catch (e) {
        console.error('downloadProposalPdf:', e);
        showToast(T.ctaConfirmError || 'Error', 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = orig; }
      }
    }

    async function confirmProposalByEmail() {
      const btns = ['ctaConfirmBtn', 'ctaConfirmBtnTop']
        .map(id => document.getElementById(id))
        .filter(Boolean);
      if (btns.some(b => b.disabled)) return;

      if (!proposalState.proposalId) {
        showToast(T.ctaConfirmError || 'Error', 'error');
        return;
      }

      const originals = btns.map(b => b.textContent);
      btns.forEach(b => { b.disabled = true; b.textContent = '...'; });

      try {
        const r = await fetch('/api/validate-proposal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proposalId: proposalState.proposalId, clientConfirm: true })
        });
        const data = await r.json();
        if (!r.ok || !data.success) throw new Error(data.error || `confirm ${r.status}`);

        btns.forEach(b => { b.textContent = T.ctaConfirmed; });
        showToast(T.ctaConfirmed, 'success');
      } catch (err) {
        console.error('confirm error:', err);
        btns.forEach((b, i) => { b.disabled = false; b.textContent = originals[i]; });
        showToast(T.ctaConfirmError, 'error');
      }
    }

    // =============================================
    // APPROVE FLOW
    // =============================================
    function showApproveModal() {
      const total = proposalState.shows.reduce((sum, s) => sum + getAdjustedPrice(s.currentPrice), 0);
      document.getElementById('approveModalIcon').innerHTML = '&#9989;';
      document.getElementById('approveModalTitle').textContent = 'Aprobar propuesta';
      document.getElementById('approveModalText').innerHTML =
        `Se guardará como <strong>versión final</strong> y se generará el PDF.<br><br>` +
        `Cliente: <strong>${escapeHtmlText(proposalState.client.email || proposalState.client.name || '\u2014')}</strong><br>` +
        `Presupuesto: <strong>${formatPrice(total)}\u20AC</strong> (+ IVA).`;
      document.getElementById('approveModalActions').innerHTML =
        `<button class="btn-cancel" onclick="closeModal()">Cancelar</button>` +
        `<button class="btn-confirm" onclick="confirmApproval()">Aprobar propuesta</button>`;
      document.getElementById('modalOverlay').classList.add('show');
      document.getElementById('approveModal').classList.add('show');
    }

    // Paso 2: propuesta ya aprobada. Link + acciones de envío con botones
    // DISTINTOS al paso 1 (antes se reusaban y confundia / re-ejecutaba).
    function showApprovedModal(clientUrl) {
      document.getElementById('approveModalIcon').innerHTML = '&#9989;';
      document.getElementById('approveModalTitle').textContent = 'Propuesta aprobada';
      document.getElementById('approveModalText').innerHTML =
        `Guardada como versión final. GHL enviará el email al cliente <strong>automáticamente</strong>.<br><br>Link para el cliente:<br>` +
        `<a href="${clientUrl}" target="_blank" style="color: var(--accent); word-break: break-all;">${clientUrl}</a><br><br>` +
        `<small>El link se copió al portapapeles — útil para enviarlo también por WhatsApp.</small>`;
      document.getElementById('approveModalActions').innerHTML =
        `<button class="btn-cancel" onclick="copyProposalLink('${clientUrl}', this)">Copiar link</button>` +
        `<button class="btn-confirm" onclick="closeModal()">Listo</button>`;
      document.getElementById('modalOverlay').classList.add('show');
      document.getElementById('approveModal').classList.add('show');
    }

    async function copyProposalLink(url, btn) {
      try { await navigator.clipboard.writeText(url); if (btn) { const t = btn.textContent; btn.textContent = 'Copiado \u2713'; setTimeout(() => btn.textContent = t, 1500); } }
      catch (e) { prompt('Copia el link:', url); }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
      document.getElementById('approveModal').classList.remove('show');
    }

    async function confirmApproval() {
      closeModal();
      proposalState.status = 'approved';
      flushPendingEditableEdits(); // capturar ediciones inline antes de serializar
      updateAdminBar();
      showToast('Guardando propuesta...', '');

      // Build proposal payload
      const payload = {
        id: proposalState.proposalId || null,
        status: 'approved',
        client: proposalState.client,
        event: proposalState.event,
        category: proposalState.category,
        concept: proposalState.concept,
        heroSub: proposalState.heroSub,
        heroSubEn: proposalState.heroSubEn,
        shows: proposalState.shows.map(s => ({
          id: s.id,
          name: s.name,                // override admin del nombre del show
          description: s.description,  // override admin de la descripción
          currentPrice: s.currentPrice,
          contextLabel: s.contextLabel,
          priceNote: s.priceNote,
          base_price: s.basePrice,
          extras: Array.isArray(s.extras) ? s.extras : []
        })),
        globalMargin: proposalState.globalMargin,
        hideSummary: proposalState.hideSummary,
        heroImageUrl: proposalState.heroImageUrl || null,
        conditions: getPersistableConditions(),
        ghlContactId: proposalState.ghlContactId || null,
        ghlOpportunityId: proposalState.ghlOpportunityId || null
      };

      try {
        const res = await fetch('/api/save-proposal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success && result.id) {
          proposalState.proposalId = result.id;
          const clientUrl = `${window.location.origin}/propuesta.html?id=${result.id}`;

          // Generar PDF en el servidor (escribe url_propuesta_pdf + nota
          // timeline). Después llamar validate-proposal para setear
          // opp.validar_propuesta ("validada por Xavi"), tag `proposal` y
          // monetaryValue. validate-proposal dispara los workflows GHL.
          showToast('Generando PDF…');
          try {
            await generateProposalPdf(result.id);
          } catch (pdfErr) {
            console.error('PDF generation failed (non-blocking):', pdfErr);
          }

          fetch('/api/validate-proposal', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ proposalId: result.id })
          }).catch(err => console.error('validate-proposal trigger error:', err));

          // Copiar link + pasar el modal al PASO 2 (botones distintos:
          // Copiar / Enviar por email / Cerrar). Ya no reusamos los botones
          // "Cancelar/Confirmar envío" del paso 1.
          showToast('Propuesta aprobada ✓', 'success');
          try { await navigator.clipboard.writeText(clientUrl); } catch(e) {}
          showApprovedModal(clientUrl);
        } else {
          throw new Error(result.error || 'Error al guardar');
        }
      } catch (err) {
        console.error('Save error:', err);
        showToast('Propuesta aprobada (guardado offline — API no disponible)', 'success');
      }
    }

    // =============================================
    // PDF EXPORT (server-side, Puppeteer)
    // =============================================
    // El PDF se genera en /api/generate-proposal-pdf: Chromium headless
    // navega a esta misma página con ?print=1, captura A4 y lo sube a
    // Supabase Storage + GHL. Devuelve la URL pública del PDF.
    async function generateProposalPdf(proposalId) {
      // Pasar el LANG actual al backend para que Puppeteer abra la página
      // directo en ese idioma (sin depender del redirect automático que en
      // print-mode puede ganarle la carrera a Puppeteer y capturar en ES).
      const r = await fetch('/api/generate-proposal-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ proposalId, lang: LANG })
      });
      const data = await r.json();
      if (!r.ok || !data.success) throw new Error(data.error || `pdf ${r.status}`);
      return data;
    }

    // Guarda la propuesta actual (borrador) y devuelve su id. El PDF
    // server-side se renderiza desde la BD, así que necesita una fila en
    // `proposals` — en modo builder/auto la propuesta aún no existe.
    async function saveProposalDraft(langOverride) {
      flushPendingEditableEdits(); // capturar ediciones inline antes de serializar
      const payload = {
        id: proposalState.proposalId || null,
        status: proposalState.status || 'revision',
        client: proposalState.client,
        event: proposalState.event,
        category: proposalState.category,
        concept: proposalState.concept,
        heroSub: proposalState.heroSub,
        heroSubEn: proposalState.heroSubEn,
        shows: proposalState.shows.map(s => ({
          id: s.id,
          name: s.name,
          description: s.description,
          nameEn: s.nameEn,
          descriptionEn: s.descriptionEn,
          priceNoteEn: s.priceNoteEn,
          currentPrice: s.currentPrice,
          contextLabel: s.contextLabel,
          priceNote: s.priceNote,
          base_price: s.basePrice,
          extras: Array.isArray(s.extras) ? s.extras : []
        })),
        globalMargin: proposalState.globalMargin,
        hideSummary: proposalState.hideSummary,
        heroImageUrl: proposalState.heroImageUrl || null,
        conditions: getPersistableConditions(),
        ghlContactId: proposalState.ghlContactId || null,
        ghlOpportunityId: proposalState.ghlOpportunityId || null
      };
      // Persistir el idioma: el override (p.ej. al cambiar de idioma) o el actual.
      payload.lang = (langOverride === 'en' || langOverride === 'es') ? langOverride : LANG;
      const r = await fetch('/api/save-proposal', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      if (!data.success || !data.id) throw new Error(data.error || 'Error al guardar la propuesta');
      proposalState.proposalId = data.id;
      return data.id;
    }

    async function exportPDF() {
      try {
        // Siempre persistir antes de generar: el PDF se renderiza desde
        // /api/get-proposal (BD), así que cualquier edición local (precios,
        // shows, márgenes) tiene que estar guardada o el PDF saldrá viejo.
        showToast('Guardando propuesta…');
        const proposalId = await saveProposalDraft();
        showToast('Generando PDF en el servidor…');
        const data = await generateProposalPdf(proposalId);
        showToast('PDF generado ✓', 'success');
        window.open(data.url, '_blank');
      } catch (e) {
        console.error('exportPDF error:', e);
        showToast('Error generando PDF: ' + e.message, 'error');
      }
    }

    // =============================================
    // TOAST
    // =============================================
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (type ? ' ' + type : '');
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    // =============================================
    // AUTO MODE — auto-generate from form data
    // =============================================
    function initAuto() {
      const params = new URLSearchParams(window.location.search);
      let formData;
      try {
        formData = JSON.parse(decodeURIComponent(atob(params.get('data'))));
      } catch (e) {
        document.getElementById('proposalContent').innerHTML = '<div style="padding:100px;text-align:center;"><h2>Error al cargar datos del formulario</h2></div>';
        return;
      }

      // Map form categories to catalog categories
      const catMap = { 'Danza': 'danza', 'Música': 'música', 'Circo': 'circo', 'WOW Effect': 'wow' };
      const selectedCats = (formData.categorias || []).map(c => catMap[c]).filter(Boolean);
      const selectedSubs = (formData.subcategorias || []).map(s => s.toLowerCase());

      // Match shows: 1 show por CATEGORIA seleccionada (spec Xavi 2026-05-12).
      // Score: foto + video > foto > video > nada. Subcategoria coincidente suma extra.
      const matched = [];
      const matchedIds = new Set();
      const usedCategories = new Set();

      const scoreShow = (show) => {
        let s = 0;
        if (show.imageUrl) s += 3;
        if (show.videoUrl) s += 2;
        const subLower = (show.subcategory || '').toLowerCase();
        if (selectedSubs.some(x => subLower.includes(x) || x.includes(subLower))) s += 4;
        return s;
      };

      // Si el form trajo categorías, una por categoría. Si no, picks mixtos del catálogo activo.
      const targetCats = selectedCats.length ? selectedCats : Array.from(new Set(Object.values(SHOW_CATALOG).map(s => s.category))).slice(0, 4);

      targetCats.forEach((cat) => {
        if (usedCategories.has(cat)) return;
        const inCat = Object.entries(SHOW_CATALOG)
          .filter(([, s]) => s.category === cat)
          .map(([id, s]) => ({ id, show: s, score: scoreShow(s) }))
          .sort((a, b) => b.score - a.score);
        const pick = inCat[0];
        if (pick) {
          matched.push(pick.id);
          matchedIds.add(pick.id);
          usedCategories.add(cat);
        }
      });

      // Determine primary category
      let primaryCat = 'shows';
      if (selectedCats.length === 1) primaryCat = selectedCats[0];
      else if (selectedCats.length > 1) primaryCat = 'shows';

      const catConfig = CATEGORY_CONFIG[primaryCat] || CATEGORY_CONFIG.shows;

      // Build proposal data
      const eventTypeMap = {
        'Cena de gala': 'Cena de gala',
        'Cocktail / Welcome drink': 'Cocktail',
        'Lanzamiento de producto': 'Lanzamiento',
        'Convencion / Congreso': 'Congreso',
        'Entrega de premios': 'Entrega de premios',
        'Family Day corporativo': 'Family Day',
        'Fiesta temática': 'Fiesta temática',
        'Fiesta de empresa': 'Fiesta corporativa'
      };

      proposalState.client = {
        name: formData.nombre || 'Cliente',
        company: formData.empresa || '',
        email: formData.email || '',
        phone: formData.telefono || ''
      };
      proposalState.event = {
        name: `${formData.tipoEvento || 'Evento'} — ${formData.empresa || formData.nombre || 'Cliente'}`,
        type: eventTypeMap[formData.tipoEvento] || formData.tipoEvento || 'Evento',
        date: formData.fechaEvento || 'Por confirmar',
        guests: parseInt(formData.numAsistentes) || 0,
        location: formData.ubicacion || 'Por confirmar'
      };
      proposalState.category = primaryCat;
      proposalState.concept = {
        title: catConfig.conceptTitle,
        text: catConfig.conceptText
      };
      proposalState.isAdmin = true;
      proposalState.shows = matched.map(id => ({
        ...SHOW_CATALOG[id],
        id: id,
        currentPrice: SHOW_CATALOG[id].basePrice,
        contextLabel: SHOW_CATALOG[id].subcategory
      }));

      applyBodyTheme(catConfig.theme);
      document.getElementById('pageTitle').textContent = proposalState.event.name + ' — Eventos Barcelona';

      renderProposal();

      document.getElementById('adminBar').classList.add('visible');
      updateAdminBar();

      // Show info toast
      showToast(`Propuesta auto-generada: ${matched.length} shows de ${selectedCats.length || 'todas las'} categorias`, 'success');
    }

    // =============================================
    // BUILDER MODE
    // =============================================
    let builderSelectedShows = [];
    let builderCurrentFilter = 'all';

    function initBuilder() {
      document.getElementById('builderMode').style.display = 'block';
      document.getElementById('proposalContent').style.display = 'none';
      updateBuilderTabs();
      renderBuilderGrid();
    }

    // Reconstruye las pestañas de categoría con los CONTEOS REALES del catálogo
    // activo (antes estaban hardcodeadas: "Todos (68)"…). Incluye cualquier
    // categoría presente para que ningún show quede sin pestaña.
    function updateBuilderTabs() {
      const tabsEl = document.getElementById('builderTabs');
      if (!tabsEl) return;
      const counts = {}; let total = 0;
      Object.values(SHOW_CATALOG).forEach(s => {
        const c = (s && s.category) ? s.category : 'otros';
        counts[c] = (counts[c] || 0) + 1; total++;
      });
      const labels = { danza: 'Danza', musica: 'Música', circo: 'Circo', wow: 'WOW Effect' };
      const order = ['danza', 'musica', 'circo', 'wow'];
      const cats = order.filter(c => counts[c])
        .concat(Object.keys(counts).filter(c => !order.includes(c)).sort());
      let html = `<button class="builder-tab ${builderCurrentFilter === 'all' ? 'active' : ''}" data-cat="all" onclick="filterBuilderCat('all')">Todos (${total})</button>`;
      cats.forEach(c => {
        const lbl = labels[c] || (c.charAt(0).toUpperCase() + c.slice(1));
        html += `<button class="builder-tab ${builderCurrentFilter === c ? 'active' : ''}" data-cat="${c}" onclick="filterBuilderCat('${c}')">${lbl} (${counts[c]})</button>`;
      });
      tabsEl.innerHTML = html;
    }

    function renderBuilderGrid() {
      const grid = document.getElementById('builderGrid');
      const catLabels = { danza: 'Danza', musica: 'Música', circo: 'Circo', wow: 'WOW Effect' };
      let html = '';

      Object.entries(SHOW_CATALOG).forEach(([id, show]) => {
        if (builderCurrentFilter !== 'all' && show.category !== builderCurrentFilter) return;
        const selected = builderSelectedShows.includes(id);
        html += `
          <div class="builder-card ${selected ? 'selected' : ''}" data-id="${id}" onclick="toggleBuilderShow('${id}')">
            <img class="builder-card-img" src="${show.imageUrl || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22 viewBox=%220 0 400 200%22><rect width=%22400%22 height=%22200%22 fill=%22%231a1a1a%22/><g fill=%22none%22 stroke=%22%23555%22 stroke-width=%221.5%22 transform=%22translate(168 68)%22><rect x=%220%22 y=%220%22 width=%2264%22 height=%2264%22 rx=%222%22/><circle cx=%2222%22 cy=%2222%22 r=%224%22/><path d=%22M64 48 53 37a4 4 0 0 0-6 0L18 64%22/></g></svg>'}" alt="${show.name}" loading="lazy">
            <div class="builder-card-body">
              <div class="builder-card-cat">${catLabels[show.category] || show.category} · ${show.subcategory}</div>
              <h4>${show.name}</h4>
              <p>${show.description}</p>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    function toggleBuilderShow(id) {
      const idx = builderSelectedShows.indexOf(id);
      if (idx > -1) {
        builderSelectedShows.splice(idx, 1);
      } else {
        builderSelectedShows.push(id);
      }
      updateBuilderSelection();
      renderBuilderGrid();
    }

    function removeBuilderShow(id) {
      builderSelectedShows = builderSelectedShows.filter(s => s !== id);
      updateBuilderSelection();
      renderBuilderGrid();
    }

    function updateBuilderSelection() {
      const bar = document.getElementById('builderSelection');
      const count = document.getElementById('builderCount');
      const chips = document.getElementById('builderChips');

      count.textContent = builderSelectedShows.length;

      if (builderSelectedShows.length > 0) {
        bar.classList.add('visible');
        chips.innerHTML = builderSelectedShows.map(id => {
          const show = SHOW_CATALOG[id];
          return `<span class="builder-chip">${show.name}<span class="builder-chip-remove" onclick="event.stopPropagation();removeBuilderShow('${id}')">&times;</span></span>`;
        }).join('');
      } else {
        bar.classList.remove('visible');
        chips.innerHTML = '';
      }
    }

    function filterBuilderCat(cat) {
      builderCurrentFilter = cat;
      document.querySelectorAll('.builder-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.cat === cat);
      });
      renderBuilderGrid();
    }

    function generateProposal() {
      if (builderSelectedShows.length === 0) {
        alert('Selecciona al menos un show');
        return;
      }

      const category = document.getElementById('bCategory').value;

      // Build proposal data from form
      const data = {
        client: {
          name: document.getElementById('bClientName').value || 'Cliente',
          company: document.getElementById('bCompany').value || 'Empresa',
          email: document.getElementById('bEmail').value || 'email@empresa.com',
          phone: document.getElementById('bPhone').value || ''
        },
        event: {
          name: document.getElementById('bEventName').value || 'Evento',
          type: document.getElementById('bEventType').value,
          date: document.getElementById('bDate').value || 'Fecha por confirmar',
          guests: parseInt(document.getElementById('bGuests').value) || 0,
          location: document.getElementById('bLocation').value || 'Por confirmar',
          concept: document.getElementById('bConceptTitle').value || ''
        },
        category: category,
        concept: {
          title: document.getElementById('bConceptTitle').value || CATEGORY_CONFIG[category].conceptTitle,
          text: document.getElementById('bConceptText').value || CATEGORY_CONFIG[category].conceptText
        },
        shows: builderSelectedShows,
        showContexts: {}
      };

      // Auto-generate context labels from subcategories
      builderSelectedShows.forEach(id => {
        data.showContexts[id] = { label: SHOW_CATALOG[id].subcategory };
      });

      // Hide builder, show proposal
      document.getElementById('builderMode').style.display = 'none';
      document.getElementById('proposalContent').style.display = 'block';

      // Set state and render
      proposalState.client = data.client;
      proposalState.event = data.event;
      proposalState.category = data.category;
      proposalState.concept = data.concept;
      proposalState.isAdmin = true;
      proposalState.shows = data.shows.map(id => ({
        ...SHOW_CATALOG[id],
        id: id,
        currentPrice: SHOW_CATALOG[id].basePrice,
        contextLabel: (data.showContexts[id]) ? data.showContexts[id].label : SHOW_CATALOG[id].subcategory
      }));

      const catConfig = CATEGORY_CONFIG[data.category] || CATEGORY_CONFIG.shows;
      applyBodyTheme(catConfig.theme);
      document.getElementById('pageTitle').textContent = data.event.name + ' — Eventos Barcelona';

      renderProposal();

      document.getElementById('adminBar').classList.add('visible');
      updateAdminBar();

      window.scrollTo(0, 0);
      showToast('Propuesta generada con ' + builderSelectedShows.length + ' shows', 'success');
    }

    // =============================================
    // BOOT
    // =============================================
    // Aplica el tema de categoría al body sin perder la clase print-mode
    // (las funciones de render hacen body.className = tema, que la borraría).
    function applyBodyTheme(theme) {
      document.body.className = theme;
      if (new URLSearchParams(window.location.search).get('print') === '1') {
        document.body.classList.add('print-mode');
      }
    }

    // =============================================
    // SEÑAL PARA PUPPETEER (?print=1)
    // =============================================
    // El backend (/api/generate-proposal-pdf) navega a esta página con
    // ?print=1 y espera a window.__pdfReady antes de capturar el PDF.
    // Esperamos a que la propuesta esté renderizada y todas las imágenes
    // (incl. background-image de shows/hero) estén cargadas.
    async function signalPdfReady() {
      for (let i = 0; i < 150; i++) {
        if (document.querySelector('#proposalContent .hero')) break;
        await new Promise(r => setTimeout(r, 100));
      }
      const urls = [];
      document.querySelectorAll('#proposalContent img').forEach(img => {
        if (img.src) urls.push(img.src);
      });
      document.querySelectorAll('#proposalContent [style*="background-image"]').forEach(el => {
        const m = (el.style.backgroundImage || '').match(/url\(['"]?(.*?)['"]?\)/);
        if (m && m[1]) urls.push(m[1]);
      });
      await Promise.all(urls.map(u => new Promise(res => {
        const im = new Image();
        im.onload = im.onerror = () => res();
        im.src = u;
      })));
      await new Promise(r => setTimeout(r, 400));
      window.__pdfReady = true;
    }

    // Listener global para persistir ediciones inline antes de cualquier
    // re-render. Cubre fields con `data-field` (dotted path en proposalState
    // — event.name, concept.title, heroSub, etc.) y `data-show-field` (con
    // `data-show-index` para resolver el show afectado). Sin esto, cualquier
    // renderProposal() llamado tras editar (ej. cambiar precio, añadir extra,
    // mover slider de margen) borraba lo que se acababa de tipear. Bug
    // reportado por Xavi 2026-05-19.
    //
    // Usamos focusout en vez de blur porque blur no burbujea y necesitamos
    // delegation desde document.
    function persistEditableField(el) {
      if (!el || !el.matches) return;
      // Guarda anti-corrupción: si el nodo ya fue desconectado del DOM (ej.
      // borraste un bloque con removeShow → re-render → el navegador dispara
      // un focusout TARDÍO sobre el nodo viejo ya detached), NO persistimos.
      // Si no, escribiríamos el texto del bloque borrado en el índice que
      // ahora ocupa el bloque siguiente. Bug Xavi 2026-06-18: borrar el bloque
      // de arriba dejaba su texto pegado en el bloque que subía.
      if (!document.body.contains(el)) return;
      const text = (el.innerText || el.textContent || '').replace(/ /g, ' ').trim();
      // data-field: path dotted en proposalState (event.name, concept.title, heroSub...)
      const fieldPath = el.dataset && el.dataset.field;
      if (fieldPath) {
        const parts = fieldPath.split('.');
        let obj = proposalState;
        for (let i = 0; i < parts.length - 1; i++) {
          if (obj[parts[i]] == null || typeof obj[parts[i]] !== 'object') obj[parts[i]] = {};
          obj = obj[parts[i]];
        }
        obj[parts[parts.length - 1]] = text;
        if (proposalState.isAdmin && typeof updateAdminBar === 'function') {
          const bar = document.getElementById('adminBar');
          if (bar) bar.classList.add('visible');
          updateAdminBar();
        }
        return;
      }
      // data-show-field: campo de un show puntual (name, description, contextLabel).
      // Resolvemos el show por su ID (estable) leyendo el .block contenedor, no
      // por data-show-index: el índice se corre cuando se borra/reordena un
      // bloque y escribiría en el show equivocado.
      const showField = el.dataset && el.dataset.showField;
      if (showField && proposalState.shows) {
        const block = el.closest('.block');
        const showId = block && block.dataset ? block.dataset.show : null;
        let target = null;
        if (showId != null && showId !== '') {
          // Resolver por ID. Si el show ya no existe en el array (fue borrado),
          // NO escribimos nada — caer al índice acá pisaría el show que ahora
          // ocupa esa posición con el texto del bloque borrado. Ese era el bug
          // exacto: flushPendingEditableEdits() corre tras el splice, lee el
          // DOM viejo, y el fallback por índice corrompía al vecino.
          target = proposalState.shows.find(s => String(s.id) === String(showId)) || null;
        } else {
          // Solo sin id (caso legacy improbable) usamos el índice.
          const idx = parseInt(el.dataset.showIndex, 10);
          if (Number.isFinite(idx)) target = proposalState.shows[idx] || null;
        }
        if (target) {
          target[showField] = text;
          if (proposalState.isAdmin && typeof updateAdminBar === 'function') {
            const bar = document.getElementById('adminBar');
            if (bar) bar.classList.add('visible');
            updateAdminBar();
          }
        }
      }
    }
    document.addEventListener('focusout', function(e) {
      const t = e.target;
      if (!t || !t.getAttribute || !t.getAttribute('contenteditable')) return;
      if (t.dataset && (t.dataset.field || t.dataset.showField)) {
        persistEditableField(t);
      }
    }, true);
    // Enter sin shift = blur (acaba la edición). Evita que se inyecte un <br>.
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Enter' || e.shiftKey) return;
      const t = e.target;
      if (!t || !t.getAttribute || !t.getAttribute('contenteditable')) return;
      if (t.dataset && (t.dataset.field || t.dataset.showField)) {
        e.preventDefault();
        t.blur();
      }
    });

    document.addEventListener('DOMContentLoaded', async function() {
      const params = new URLSearchParams(window.location.search);
      const isPrint = params.get('print') === '1';
      if (isPrint) document.body.classList.add('print-mode');

      await loadShowCatalogFromSupabase();
      const mode = params.get('mode');
      if (mode === 'builder') {
        initBuilder();
      } else if (mode === 'auto') {
        initAuto();
      } else {
        await init();
      }

      if (isPrint) {
        signalPdfReady().catch(err => {
          console.error('signalPdfReady error:', err);
          window.__pdfReady = true; // no bloquear la captura
        });
      }
    });
  </script>
