<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title id="pageTitle">Propuesta — Eventos Barcelona</title>
  <link rel="icon" type="image/webp" href="/EB-eventos-barcelona-logo-3d.webp">
  <link rel="apple-touch-icon" href="/EB-eventos-barcelona-logo-3d.webp">
  <meta property="og:image" content="https://propuestas.eventosbarcelona.com/EB-eventos-barcelona-logo-3d.webp">
  <meta property="og:title" content="Propuesta — Eventos Barcelona">
  <meta property="og:description" content="Propuesta personalizada para tu evento.">
  <meta name="twitter:card" content="summary_large_image">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       CSS VARIABLES — Category themes override these
       ============================================= */
    :root {
      --accent: #E87461;
      --accent-hover: #d4604f;
      --dark: #1a1a1a;
      --text: #333;
      --gray: #666;
      --light-gray: #f9f9f9;
      --border: #e5e5e5;
      --white: #fff;
      --hero-bg: var(--dark);
    }

    /* Category themes */
    body.theme-danza {
      --accent: #C75B7A;
      --accent-hover: #b04a69;
    }
    body.theme-musica {
      --accent: #5B8AC7;
      --accent-hover: #4a79b6;
    }
    body.theme-circo {
      --accent: #E8A461;
      --accent-hover: #d4904f;
    }
    body.theme-shows {
      --accent: #E87461;
      --accent-hover: #d4604f;
    }
    body.theme-wow {
      --accent: #8B5BC7;
      --accent-hover: #7a4ab6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--white);
      color: var(--text);
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-weight: 400;
    }

    /* === NAV === */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 80px;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
    }

    .nav-logo img { height: 48px; width: auto; }

    .nav-right { display: flex; align-items: center; gap: 16px; }

    .btn-contact {
      display: inline-block;
      padding: 10px 28px;
      border: 1.5px solid #fff;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 24px;
      transition: all 0.3s;
    }

    .btn-contact:hover { background: #fff; color: var(--dark); }

    .btn-approve-client {
      display: inline-block;
      padding: 10px 24px;
      background: #2ecc71;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-approve-client:hover { background: #27ae60; }
    .btn-approve-client:disabled { opacity: 0.7; cursor: default; }

    /* Descargar PDF — vista CLIENTE de propuestas aprobadas. Secundario
       (outline) para no competir con el verde de "Aprobar presupuesto". */
    .btn-pdf-client {
      display: inline-block;
      padding: 10px 24px;
      background: transparent;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: 1.5px solid rgba(255,255,255,0.45);
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-pdf-client:hover { background: rgba(255,255,255,0.14); border-color: #fff; }
    .btn-pdf-client:disabled { opacity: 0.6; cursor: progress; }
    .btn-pdf-client.large { padding: 16px 40px; font-size: 15px; }
    body.print-mode .btn-pdf-client { display: none !important; }

    .btn-approve-client.large {
      padding: 16px 48px;
      font-size: 15px;
    }

    /* === HERO === */
    .hero {
      min-height: 100vh;
      background: var(--hero-bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 100px 80px;
      position: relative;
      overflow: hidden;
    }

    .hero-bg-image {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.3;
    }

    .hero-image-change {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s;
      backdrop-filter: blur(6px);
    }
    .hero-image-change:hover { background: rgba(255,255,255,0.22); }

    .hero-picker-container { max-width: 1100px !important; }
    .hero-image-grid {
      padding: 8px 24px 24px;
      overflow-y: auto;
    }
    .hero-section {
      margin-top: 18px;
    }
    .hero-section:first-of-type { margin-top: 6px; }
    .hero-section-title {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gray);
      padding: 6px 0 10px;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2;
    }
    .hero-show-group {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    .hero-show-group:first-child { border-top: none; padding-top: 4px; }
    .hero-show-name {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--dark);
      align-self: center;
      padding-right: 8px;
    }
    .hero-show-name small {
      display: block;
      font-size: 10px;
      color: var(--gray);
      font-weight: 400;
      margin-top: 2px;
    }
    .hero-show-tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .hero-image-tile {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.15s;
      overflow: hidden;
    }
    .hero-image-tile:hover { transform: translateY(-2px); border-color: var(--accent); }
    .hero-image-tile.selected { border-color: var(--accent); }
    .hero-image-tile .tile-label {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      color: #fff;
      padding: 18px 10px 8px;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .hero-image-tile.placeholder {
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.45);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      text-align: center;
      padding: 12px;
    }
    .hero-image-reset {
      grid-column: 1 / -1;
      padding: 10px 14px;
      border: 1.5px dashed var(--border);
      background: transparent;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      cursor: pointer;
      transition: all 0.15s;
    }
    .hero-image-reset:hover { color: var(--accent); border-color: var(--accent); }

    .hero h1 {
      font-size: clamp(48px, 7vw, 90px);
      line-height: 1.05;
      margin-bottom: 24px;
      font-family: 'DM Serif Display', Georgia, serif;
      position: relative;
      z-index: 1;
    }

    .hero-sub {
      font-size: 18px;
      max-width: 640px;
      line-height: 1.7;
      color: #ccc;
      position: relative;
      z-index: 1;
    }

    .hero-detail {
      font-size: 14px;
      margin-top: 16px;
      color: #999;
      font-weight: 500;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 1;
    }

    /* === CONCEPT === */
    .concept-section {
      padding: 100px 80px;
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .section-label {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .concept-section h2 {
      font-size: 38px;
      color: var(--dark);
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .concept-section p {
      font-size: 16px;
      color: var(--gray);
      line-height: 1.8;
    }

    /* === SHOW BLOCKS === */
    .block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 520px;
    }

    .block--reversed { direction: rtl; }
    .block--reversed > * { direction: ltr; }

    .block-image {
      background-size: cover;
      background-position: center;
      min-height: 400px;
    }
    .block-image--placeholder {
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.35);
    }

    /* === CAROUSEL (multi-imagen por show) === */
    .block-carousel { position: relative; overflow: hidden; }
    .carousel-slide {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 0.6s ease;
    }
    .carousel-slide.active { opacity: 1; }
    .carousel-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(0,0,0,0.45); color: #fff; border: none;
      font-size: 22px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s, background 0.2s;
      z-index: 2;
    }
    .block-carousel:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow:hover { background: rgba(0,0,0,0.75); }
    .carousel-arrow.prev { left: 12px; }
    .carousel-arrow.next { right: 12px; }
    .carousel-dots {
      position: absolute; bottom: 14px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 6px;
      z-index: 2;
    }
    .carousel-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.45); border: none; cursor: pointer;
      padding: 0; transition: background 0.2s, transform 0.2s;
    }
    .carousel-dot.active { background: #fff; transform: scale(1.3); }
    body.print-mode .carousel-arrow,
    body.print-mode .carousel-dots { display: none !important; }
    body.print-mode .carousel-slide { opacity: 0; }
    body.print-mode .carousel-slide:first-child { opacity: 1; }
    .block-image--placeholder::after {
      content: "";
      width: 64px;
      height: 64px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-opacity='0.4' stroke-width='1.5'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='9' cy='9' r='2'/><path d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/></svg>");
      background-repeat: no-repeat;
      background-position: center;
    }

    .block-content {
      padding: 60px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .block-content h2 {
      font-size: 34px;
      color: var(--dark);
      margin-bottom: 16px;
      line-height: 1.15;
    }

    .block-content p {
      font-size: 15px;
      color: var(--gray);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .block-footer {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .block-remove {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .block-remove:hover { background: #e74c3c; }
    .block.admin-mode { position: relative; }
    .block.admin-mode .block-remove { display: flex; }

    /* Editable text in admin mode */
    .editable-text {
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      border-radius: 4px;
    }
    .editable-text:hover {
      background: rgba(232,116,97,0.08);
      outline: 1px dashed var(--accent);
      outline-offset: 4px;
    }
    .editable-text:focus {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      background: rgba(232,116,97,0.05);
    }

    /* Add show button */
    .add-show-block {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s;
      margin: 32px auto;
      max-width: 600px;
    }
    .add-show-block:hover {
      border-color: var(--accent);
      background: rgba(232,116,97,0.04);
    }
    .add-show-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
    }
    .add-show-block h3 {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .add-show-block p {
      font-size: 0.85rem;
      color: var(--gray);
    }

    /* Show picker overlay */
    .picker-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 300;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .picker-overlay.open { display: flex; }
    .picker-container {
      background: #fff;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0,0,0,0.3);
    }
    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
    }
    .picker-header h3 {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
    }
    .picker-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--gray);
      padding: 4px 8px;
    }
    .picker-search {
      padding: 14px 24px 0;
    }
    .picker-search input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      background: #fff;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .picker-search input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .picker-tabs {
      display: flex;
      gap: 6px;
      padding: 12px 24px 0;
      flex-wrap: wrap;
    }
    .picker-tab {
      padding: 6px 16px;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--gray);
      transition: all 0.2s;
    }
    .picker-tab:hover { border-color: var(--accent); color: var(--accent); }
    .picker-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .picker-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 16px 24px 24px;
      overflow-y: auto;
    }
    .picker-artist-section {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    .picker-artist-section:first-child { border-top: none; padding-top: 0; }
    .picker-artist-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .picker-artist-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--light-gray);
      background-size: cover;
      background-position: center;
      border: 1.5px solid var(--border);
      flex: 0 0 40px;
    }
    .picker-artist-avatar--initial {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }
    .picker-artist-avatar--star {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: #b88a00;
      background: #ffd84d;
      border-color: #ffd84d;
    }
    .picker-fav-star {
      color: #d6a800;
      margin-right: 4px;
      font-size: 0.95em;
    }
    .picker-artist-meta { display: flex; flex-direction: column; gap: 2px; }
    .picker-artist-meta h3 {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--dark);
      margin: 0;
      line-height: 1.2;
    }
    .picker-artist-meta span {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .picker-artist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .picker-card {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }
    .picker-card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .picker-card.already-added { opacity: 0.4; pointer-events: none; }
    .picker-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }
    .picker-card-body {
      padding: 10px 12px;
    }
    .picker-card-body small {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    .picker-card-body h4 {
      font-size: 0.85rem;
      color: var(--dark);
      margin-top: 2px;
      line-height: 1.3;
    }

    .block-price {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 28px;
      color: var(--dark);
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .block-price small {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--gray);
      font-weight: 400;
    }

    .block-price.editable {
      cursor: pointer;
      position: relative;
    }

    .block-price.editable:hover {
      color: var(--accent);
    }

    .block-extras {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: 'Inter', sans-serif;
    }

    .block-extras-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--gray);
    }
    .block-extras-row .ex-label { flex: 1; }
    .block-extras-row .ex-amount { font-weight: 600; color: var(--text); white-space: nowrap; }
    .block-extras-row.editable .ex-label,
    .block-extras-row.editable .ex-amount {
      padding: 4px 6px;
      border-radius: 4px;
      outline: none;
    }
    .block-extras-row.editable .ex-label:hover,
    .block-extras-row.editable .ex-amount:hover,
    .block-extras-row.editable .ex-label:focus,
    .block-extras-row.editable .ex-amount:focus {
      background: var(--light-gray, #f4f4f4);
    }
    .block-extras-row .ex-remove {
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
    }
    .block-extras-row .ex-remove:hover { color: var(--accent); }
    .block-extras-add {
      align-self: flex-start;
      margin-top: 4px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--accent);
      background: none;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .block-extras-add:hover { background: var(--light-gray, #f4f4f4); }

    .summary-row.summary-row-extra {
      padding: 8px 0 8px 18px;
      font-size: 14px;
      border-bottom: 1px dashed var(--border);
      opacity: 0.9;
    }
    .summary-row.summary-row-extra span:first-child::before {
      content: '+ ';
      color: var(--gray);
    }

    .price-input {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 28px;
      color: var(--dark);
      border: 2px solid var(--accent);
      border-radius: 8px;
      padding: 4px 8px;
      width: 140px;
      outline: none;
      background: var(--light-gray);
    }

    .btn-dark {
      display: inline-block;
      padding: 10px 28px;
      background: var(--dark);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 24px;
      transition: background 0.3s;
    }

    .btn-dark:hover { background: #333; }

    /* === CTA BANNER (mid-page) === */
    .cta-banner {
      padding: 100px 80px;
      background: var(--dark);
    }

    .cta-banner-inner {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
      color: #fff;
    }

    .cta-banner-inner h2 {
      font-size: 32px;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    .btn-outline-white {
      display: inline-block;
      padding: 12px 36px;
      border: 1.5px solid #fff;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 24px;
      transition: all 0.3s;
    }

    .btn-outline-white:hover { background: #fff; color: var(--dark); }

    /* === UPSELL === */
    .upsell-section {
      padding: 100px 80px;
      background: var(--white);
    }

    .upsell-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .upsell-content h2 {
      font-size: 38px;
      color: var(--dark);
      margin-bottom: 20px;
      line-height: 1.15;
    }

    .upsell-content p {
      font-size: 15px;
      color: var(--gray);
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .upsell-image {
      position: relative;
      min-height: 420px;
      border-radius: 16px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }

    .upsell-items {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .upsell-item {
      font-size: 13px;
      color: var(--text);
      padding: 8px 18px;
      background: var(--light-gray);
      border-radius: 20px;
      font-weight: 500;
    }

    /* === SUMMARY === */
    .summary-section {
      padding: 100px 80px;
      background: var(--light-gray);
    }
    .summary-section.admin-mode { position: relative; }
    .summary-section.admin-mode .summary-remove { display: flex; }

    .summary-remove {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .summary-remove:hover { background: #e74c3c; }

    .summary-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      color: var(--gray);
    }

    .summary-row span:last-child {
      font-weight: 600;
      color: var(--text);
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      padding: 28px 0 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--dark);
      font-family: 'DM Serif Display', Georgia, serif;
    }

    .summary-note {
      font-size: 13px;
      color: var(--gray);
      margin-top: 28px;
      line-height: 1.7;
    }

    /* === MARGIN CONTROL === */
    .margin-control {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .margin-control.visible { display: block; }

    .margin-control label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: block;
      margin-bottom: 8px;
    }

    .margin-slider-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .margin-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      outline: none;
    }

    .margin-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }

    .margin-value {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 24px;
      color: var(--dark);
      min-width: 60px;
      text-align: right;
    }

    .margin-hint {
      font-size: 12px;
      color: var(--gray);
      margin-top: 8px;
    }

    /* === STATS === */
    .stats-section {
      padding: 80px;
      text-align: center;
    }

    .stats-title {
      font-size: 28px;
      color: var(--dark);
      margin-bottom: 48px;
      font-family: 'DM Serif Display', Georgia, serif;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .stat-number {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 72px;
      font-weight: 400;
      color: transparent;
      -webkit-text-stroke: 2px var(--accent);
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--gray);
    }

    /* === CONDITIONS === */
    .conditions-section {
      padding: 80px;
      max-width: 760px;
      margin: 0 auto;
    }

    .conditions-section ul {
      list-style: none;
      padding: 0;
      margin-top: 24px;
    }

    .conditions-section li {
      font-size: 14px;
      color: var(--gray);
      padding: 8px 0 8px 20px;
      position: relative;
      line-height: 1.6;
    }

    .conditions-section li::before {
      content: '';
      position: absolute;
      left: 0; top: 15px;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--border);
    }

    .conditions-section li.editable-li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding-right: 32px;
    }

    .conditions-section li.editable-li > span {
      flex: 1;
      padding: 2px 6px;
      border-radius: 4px;
      outline: none;
    }

    .conditions-section li.editable-li > span:hover,
    .conditions-section li.editable-li > span:focus {
      background: var(--light-gray, #f4f4f4);
    }

    .conditions-section .cond-remove {
      flex-shrink: 0;
      background: none;
      border: none;
      color: var(--gray);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 2px 6px;
      margin-top: 4px;
    }
    .conditions-section .cond-remove:hover { color: var(--accent); }

    .conditions-section .cond-add {
      margin-top: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: var(--accent);
      background: none;
      border: 1px dashed var(--border);
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .conditions-section .cond-add:hover { background: var(--light-gray, #f4f4f4); }

    /* En modo print el botón × no debe aparecer aunque el HTML esté presente */
    body.print-mode .conditions-section .cond-remove,
    body.print-mode .conditions-section .cond-add { display: none; }

    /* === ABOUT === */
    .about-section {
      padding: 100px 80px;
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .about-section h2 {
      font-size: 32px;
      color: var(--dark);
      line-height: 1.5;
    }

    .about-section h2 .highlight { color: var(--accent); }

    /* === CLIENTES / PRUEBA SOCIAL === */
    .clients-section {
      padding: 20px 40px 90px;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }
    .clients-section .section-label {
      display: block;
      margin-bottom: 40px;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-size: 12px;
      font-weight: 600;
    }
    .clients-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 28px 36px;
      align-items: center;
      justify-items: center;
    }
    .clients-grid img {
      max-width: 100%;
      max-height: 46px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: grayscale(100%);
      opacity: 0.55;
      transition: filter 0.25s ease, opacity 0.25s ease;
    }
    .clients-grid img:hover {
      filter: grayscale(0%);
      opacity: 1;
    }
    @media (max-width: 900px) {
      .clients-section { padding: 10px 24px 60px; }
      .clients-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
    }
    @media (max-width: 480px) {
      .clients-grid { grid-template-columns: repeat(2, 1fr); }
    }
    /* En el PDF los logos van a color completo (más profesional impreso) */
    body.print-mode .clients-grid img { filter: grayscale(0%); opacity: 0.85; }

    /* === CTA FINAL === */
    .cta-section {
      text-align: center;
      padding: 100px 80px;
      background: var(--dark);
      color: #fff;
    }

    .cta-section h2 {
      font-size: 42px;
      margin-bottom: 16px;
    }

    .cta-section p {
      font-size: 17px;
      color: #999;
      margin-bottom: 36px;
    }

    .btn-accent {
      display: inline-block;
      padding: 16px 48px;
      background: var(--accent);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn-accent:hover { background: var(--accent-hover); }
    .btn-accent:disabled { opacity: 0.6; cursor: default; }

    /* === FOOTER === */
    .footer {
      padding: 60px 80px;
      background: var(--light-gray);
      text-align: center;
    }

    .footer-logo img {
      height: 56px;
      width: auto;
      filter: brightness(0);
    }

    .footer-address {
      font-size: 14px;
      color: var(--gray);
      margin-top: 24px;
    }

    .footer-contact {
      font-size: 14px;
      color: var(--gray);
      margin-top: 8px;
      display: flex;
      gap: 8px 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .footer-contact a {
      color: var(--gray);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-contact a:hover { color: var(--accent); }

    .footer-social {
      margin-top: 24px;
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .footer-social a {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-social a:hover { color: var(--accent); }

    /* === BUILDER MODE === */
    .builder-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
      font-family: 'Inter', sans-serif;
    }
    .builder-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .builder-header img {
      height: 48px;
      margin-bottom: 16px;
    }
    .builder-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      color: var(--dark);
      margin-bottom: 8px;
    }
    .builder-header p {
      color: var(--gray);
      font-size: 0.95rem;
    }

    /* Client form */
    .builder-form {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 40px;
    }
    .builder-form h3 {
      font-size: 1.1rem;
      margin-bottom: 20px;
      color: var(--dark);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input, .form-group select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
    }
    .form-group.full { grid-column: 1 / -1; }

    /* Category tabs */
    .builder-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .builder-tab {
      padding: 10px 20px;
      border: 2px solid var(--border);
      border-radius: 100px;
      background: var(--white);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--gray);
    }
    .builder-tab:hover { border-color: var(--accent); color: var(--accent); }
    .builder-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Show grid */
    .builder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .builder-card {
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s;
      background: var(--white);
      position: relative;
    }
    .builder-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .builder-card.selected { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,116,97,0.2); }
    .builder-card.selected::after {
      content: '\2713';
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      z-index: 2;
    }
    .builder-card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      background: #eee;
    }
    .builder-card-body {
      padding: 16px;
    }
    .builder-card-cat {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .builder-card-body h4 {
      font-size: 0.95rem;
      color: var(--dark);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .builder-card-body p {
      font-size: 0.8rem;
      color: var(--gray);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Selected shows sidebar */
    .builder-selection {
      position: sticky;
      bottom: 0;
      background: #1a1a2e;
      color: #fff;
      padding: 16px 32px;
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 200;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
    }
    .builder-selection.visible { display: flex; }
    .builder-selection-info {
      font-size: 0.9rem;
    }
    .builder-selection-info strong {
      font-size: 1.1rem;
    }
    .builder-selection-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      max-width: 60%;
    }
    .builder-chip {
      background: rgba(255,255,255,0.15);
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .builder-chip-remove {
      cursor: pointer;
      opacity: 0.6;
      font-size: 1rem;
      line-height: 1;
    }
    .builder-chip-remove:hover { opacity: 1; }
    .btn-generate {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-generate:hover { background: var(--accent-hover); }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .builder-selection { flex-direction: column; gap: 12px; padding: 16px; }
      .builder-selection-chips { max-width: 100%; }
    }

    /* === ADMIN BAR === */
    .admin-bar {
      position: sticky;
      top: 0;
      z-index: 200;
      background: #1a1a2e;
      color: #fff;
      padding: 14px 32px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-family: 'Inter', sans-serif;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }

    .admin-bar.visible { display: flex; }

    .admin-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .admin-bar-left .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f39c12;
    }

    .admin-bar-left .status-dot.approved { background: #2ecc71; }
    .admin-bar-left .status-dot.sent { background: #3498db; }

    .admin-bar-info { font-weight: 600; }

    .admin-bar-info span {
      font-weight: 400;
      color: #aaa;
      margin-left: 8px;
      font-size: 13px;
    }

    .admin-bar-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-admin {
      padding: 10px 24px;
      border: none;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-approve {
      background: #2ecc71;
      color: #fff;
    }

    .btn-approve:hover { background: #27ae60; }

    .btn-pdf {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .btn-pdf:hover { background: rgba(255,255,255,0.2); }

    .lang-toggle {
      display: inline-flex;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      overflow: hidden;
      margin-right: 4px;
    }
    .lang-toggle button {
      background: transparent;
      color: rgba(255,255,255,0.7);
      border: none;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .lang-toggle button.active {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }
    .lang-toggle button:not(.active):hover {
      color: #fff;
      background: rgba(255,255,255,0.06);
    }
    body.print-mode .lang-toggle { display: none; }

    /* === TOAST === */
    .toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1a1a2e;
      color: #fff;
      padding: 16px 32px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      z-index: 400;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { background: #2ecc71; }
    .toast.error { background: #e74c3c; }

    /* === APPROVED OVERLAY === */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 350;
    }

    .modal-overlay.show { display: block; }

    .modal-content {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 16px;
      padding: 48px 60px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.2);
      z-index: 400;
      text-align: center;
      font-family: 'Inter', sans-serif;
      max-width: 440px;
    }

    .modal-content.show { display: block; }

    .modal-content .check { font-size: 48px; margin-bottom: 16px; }
    .modal-content h3 { font-size: 22px; color: var(--dark); margin-bottom: 8px; }
    .modal-content p { font-size: 14px; color: var(--gray); line-height: 1.6; }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    .modal-actions button {
      padding: 12px 28px;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-confirm {
      background: #2ecc71;
      color: #fff;
    }

    .btn-cancel {
      background: var(--light-gray);
      color: var(--text);
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      .block { grid-template-columns: 1fr; }
      .block--reversed { direction: ltr; }
      .block-image { min-height: 280px; }
      .block-content { padding: 32px 24px; }
      .hero { padding: 60px 24px; }
      .nav { padding: 20px 24px; }
      .concept-section { padding: 60px 24px; }
      .upsell-section { padding: 60px 24px; }
      .upsell-grid { grid-template-columns: 1fr; }
      .summary-section { padding: 60px 24px; }
      .conditions-section { padding: 40px 24px; }
      .cta-section { padding: 60px 24px; }
      .cta-banner { padding: 40px 24px; }
      .footer { padding: 40px 24px; }
      .footer-social { gap: 20px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 32px; }
      .stat-number { font-size: 48px; }
      .about-section { padding: 60px 24px; }
      .about-section h2 { font-size: 24px; }
      .admin-bar { flex-direction: column; gap: 10px; padding: 12px 16px; }
    }

    /* === SERVER-SIDE PDF (Puppeteer, ?print=1) === */
    @page { size: A4; margin: 0; }
    @media print {
      .admin-bar, .toast, .modal-overlay, .modal-content { display: none !important; }
    }
    body.print-mode .admin-bar,
    body.print-mode .toast,
    body.print-mode .modal-overlay,
    body.print-mode .modal-content,
    body.print-mode .picker-overlay,
    body.print-mode .block-remove,
    body.print-mode .summary-remove,
    body.print-mode .add-show-block,
    body.print-mode .margin-control,
    body.print-mode .btn-approve-client,
    body.print-mode .cta-section { display: none !important; }
    body.print-mode {
      background: #fff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    body.print-mode .editable-text { outline: none !important; background: transparent !important; }
    body.print-mode .hero { page-break-after: always; break-after: page; }
    body.print-mode .block,
    body.print-mode .summary-section,
    body.print-mode .stats-section,
    body.print-mode .about-section,
    body.print-mode .concept-section,
    body.print-mode .conditions-section,
    body.print-mode .clients-section,
    body.print-mode .footer { page-break-inside: avoid; break-inside: avoid; }
    /* Forzar salto de página antes de bloques grandes para evitar cortes feos */
    body.print-mode .stats-section,
    body.print-mode .summary-section,
    body.print-mode .about-section { page-break-before: auto; break-before: auto; }
    /* Las imágenes nunca se cortan entre páginas */
    body.print-mode .block-image,
    body.print-mode .hero-bg-image,
    body.print-mode .stat-number { page-break-inside: avoid; break-inside: avoid; }

    /* === CIERRE DEL PDF: compactar clientes + condiciones + footer ===
       Xavi 2026-07-22: juntar el footer con los clientes en la misma página
       (antes el footer caía solo en una página casi vacía) y que el footer
       quede SIEMPRE igual y sin cortar. Los paddings web son muy grandes para
       A4; acá los reducimos SOLO en print para que el cierre entre junto. */
    /* about compacto (más chico y menos alto) para que quepa junto al resto
       del cierre en una sola página. */
    body.print-mode .about-section { padding: 28px 24px !important; }
    body.print-mode .about-section h2 { font-size: 22px !important; line-height: 1.45 !important; }
    body.print-mode .clients-section { padding: 6px 24px 16px !important; }
    body.print-mode .clients-section .section-label { margin-bottom: 14px !important; }
    body.print-mode .clients-grid { gap: 12px 24px !important; }
    body.print-mode .clients-grid img { max-height: 32px !important; }
    body.print-mode .conditions-section { padding: 14px 24px 18px !important; }
    body.print-mode .conditions-section li { margin-bottom: 7px !important; }
    body.print-mode .footer { padding: 22px 24px 26px !important; }
    /* El footer es un bloque atómico: nunca se parte entre páginas. */
    body.print-mode .footer { page-break-inside: avoid !important; break-inside: avoid !important; }
    /* ÚLTIMA PÁGINA FIJA: about + clientes + condiciones + footer SIEMPRE
       juntos en la última página. El salto se fuerza ANTES del about, y el
       resto queda pegado (page-break-before: avoid). Xavi 2026-07-22: "todo
       el cierre junto en la última página". */
    body.print-mode .about-section { page-break-before: always !important; break-before: page !important; }
    body.print-mode .clients-section,
    body.print-mode .conditions-section,
    body.print-mode .footer { page-break-before: avoid !important; break-before: avoid !important; }
    /* Evitar que el propio about deje un salto después que separe los clientes. */
    body.print-mode .about-section { page-break-after: avoid !important; break-after: avoid !important; }
    /* Como el cierre se fuerza a la última página, el resumen queda solo en su
       página. Lo centramos verticalmente para que el espacio sobrante quede
       equilibrado (arriba y abajo) en vez de un hueco al pie. Si el resumen es
       largo (muchos shows) simplemente llena y el centrado no tiene efecto. */
    body.print-mode .summary-section {
      min-height: 82vh;
      display: flex !important;
      flex-direction: column;
      justify-content: center;
      box-sizing: border-box;
    }
  </style>

    async function loadShowCatalogFromSupabase() {
      // El brief exige que las propuestas se generen sólo desde el "Catálogo
      // Activo" (artistas con tag artista_ok / proveedores con proveedor_ok).
      // En Supabase se modela con shows.status='active': Xavi aprueba el show
      // en /admin → pasa de pending_review a active. Solo esos califican.
      try {
        const r = await fetch('/api/catalog-active');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        if (!data.success || !data.count) {
          console.warn('Catalog-active devolvio 0 shows; manteniendo catálogo estatico de fallback');
          return;
        }
        // Reemplazo total: SHOW_CATALOG = solo shows con status=active.
        // Esto descarta los hardcoded que ya no están en el catálogo curado.
        SHOW_CATALOG = data.catalog;
        console.log(`Catálogo activo cargado: ${data.count} shows`);
      } catch (err) {
        console.warn('Catálogo activo: fallo al cargar, usando estatico:', err.message);
      }
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const proposalId = params.get('id') || 'demo';
      const isAdmin = params.get('admin') === '1';

      // Try demo data first, then load from API
      const demoData = DEMO_PROPOSALS[proposalId];
      if (demoData) {
        loadProposal(demoData, isAdmin);
      } else {
        // Load from Supabase API
        loadProposalFromAPI(proposalId, isAdmin);
      }
    }

    async function loadProposalFromAPI(id, isAdmin) {
      document.getElementById('proposalContent').innerHTML = '<div style="padding:100px;text-align:center;"><h2>Cargando propuesta...</h2></div>';

      try {
        const res = await fetch(`/api/get-proposal?id=${encodeURIComponent(id)}`);
        const result = await res.json();

        if (!result.success || !result.proposal) {
          document.getElementById('proposalContent').innerHTML = '<div style="padding:100px;text-align:center;"><h2>Propuesta no encontrada</h2><p>ID: ' + id + '</p></div>';
          return;
        }

        const p = result.proposal;

        // Si la propuesta tiene `lang` distinto al que estamos renderizando
        // y el usuario NO lo forzó vía ?lang= en la URL, redirigir para que
        // la página cargue con el idioma correcto. Evita que una propuesta
        // guardada en EN salga en ES (o viceversa).
        const urlParams = new URLSearchParams(location.search);
        const queryLangSet = urlParams.has('lang');
        if (!queryLangSet && p.lang && p.lang !== LANG) {
          urlParams.set('lang', p.lang);
          location.replace(`${location.pathname}?${urlParams.toString()}${location.hash}`);
          return;
        }

        proposalState.proposalId = p.id;
        proposalState.status = p.status || 'revision';
        proposalState.ghlContactId = p.ghl_contact_id || null;
        proposalState.ghlOpportunityId = p.ghl_opportunity_id || null;
        // pdf_url del PDF generado al validar. Habilita el botón "Descargar PDF"
        // en la vista CLIENTE de las propuestas aprobadas (Xavi 2026-07-17).
        proposalState.pdfUrl = p.pdf_url || null;

        // Rebuild shows from saved data (array of {id, currentPrice, contextLabel})
        const showsData = {
          client: p.client,
          event: p.event,
          category: p.category,
          concept: p.concept,
          shows: p.shows.map(s => s.id || s),
          showContexts: {}
        };
        p.shows.forEach(s => {
          if (s.id && s.contextLabel) {
            showsData.showContexts[s.id] = { label: s.contextLabel };
          }
        });

        proposalState.globalMargin = p.globalMargin || 0;
        proposalState.hideSummary = !!p.hideSummary;
        proposalState.heroImageUrl = p.heroImageUrl || null;
        // heroSub: si Xavi lo editó en admin, lo guardamos como override.
        // El render lee proposalState.heroSub/heroSubEn según LANG, con
        // fallback al catConfig si está vacío.
        proposalState.heroSub = (p.heroSub && p.heroSub.trim()) ? p.heroSub : null;
        proposalState.heroSubEn = (p.heroSubEn && p.heroSubEn.trim()) ? p.heroSubEn : null;
        // conceptEn → si vino del backend lo aplicamos al objeto concept
        if (showsData.concept) {
          if (p.conceptTitleEn) showsData.concept.titleEn = p.conceptTitleEn;
          if (p.conceptTextEn) showsData.concept.textEn = p.conceptTextEn;
        }
        // Condiciones custom: si la propuesta las tiene editadas, las usamos.
        // Si no, el render cae al default de T.conditions automáticamente.
        proposalState.conditions = Array.isArray(p.conditions) ? p.conditions : null;
        loadProposal(showsData, isAdmin);

        // Restore custom prices y overrides admin (name/description/priceNote/
        // contextLabel/extras). priceNote/name/description viven en el catalogo
        // pero admin puede sobreescribirlos por propuesta (ej. "4 artistas" →
        // "3 artistas + DJ"). Sin esto el PDF saldría con el texto del catálogo.
        p.shows.forEach((s, i) => {
          if (!proposalState.shows[i]) return;
          if (s.currentPrice) proposalState.shows[i].currentPrice = s.currentPrice;
          if (s.priceNote) proposalState.shows[i].priceNote = s.priceNote;
          if (s.priceNoteEn) proposalState.shows[i].priceNoteEn = s.priceNoteEn;
          if (s.name) proposalState.shows[i].name = s.name;
          if (s.nameEn) proposalState.shows[i].nameEn = s.nameEn;
          if (s.description) proposalState.shows[i].description = s.description;
          if (s.descriptionEn) proposalState.shows[i].descriptionEn = s.descriptionEn;
          if (Array.isArray(s.extras)) proposalState.shows[i].extras = s.extras;
        });
        renderProposal();
        // showAdminBar incluye approved (mostrar toggle + PDF) y revision (todo).
        if (proposalState.showAdminBar) {
          document.getElementById('adminBar').classList.add('visible');
          updateAdminBar();
        }

      } catch (err) {
        document.getElementById('proposalContent').innerHTML = '<div style="padding:100px;text-align:center;"><h2>Error al cargar propuesta</h2><p>' + err.message + '</p></div>';
      }
    }

    function loadProposal(data, isAdmin) {
      proposalState.client = data.client;
      proposalState.event = data.event;
      proposalState.category = data.category;
      proposalState.concept = data.concept;
      // showAdminBar: el usuario abrió ?admin=1 → mostrar toggle ES/EN + Exportar PDF
      // isAdmin: edición real. Si la propuesta ya está aprobada queda CONGELADA
      //   aunque el usuario abra con admin=1 (Spec Xavi 2026-05-29).
      proposalState.showAdminBar = isAdmin;
      proposalState.isAdmin = isAdmin && proposalState.status !== 'approved';
      proposalState.shows = data.shows.map(id => {
        const show = SHOW_CATALOG[id];
        if (!show) return null;
        return {
          ...show,
          id: id,
          currentPrice: show.basePrice,
          contextLabel: (data.showContexts && data.showContexts[id]) ? data.showContexts[id].label : show.subcategory,
          extras: []
        };
      }).filter(Boolean);

      const catConfig = CATEGORY_CONFIG[data.category] || CATEGORY_CONFIG.shows;
      applyBodyTheme(catConfig.theme);
      document.getElementById('pageTitle').textContent = data.event.name + ' — Eventos Barcelona';

      renderProposal();

      if (isAdmin) {
        document.getElementById('adminBar').classList.add('visible');
        updateAdminBar();
      }
    }

    // =============================================
    // RENDER PROPOSAL
    // =============================================
    // Devuelve la versión localizada de un campo del show según LANG actual.
    // Cuando LANG='en' usamos el sufijo *En del catálogo (nameEn,
    // descriptionEn, priceNoteEn, subcategoryEn). Fallback al campo base si
    // el EN está vacío (covers shows que no tienen traducción aún).
    function localizedShowField(show, base) {
      if (!show) return '';
      if (LANG === 'en') {
        const enKey = base + 'En'; // nameEn, descriptionEn, priceNoteEn, subcategoryEn
        if (show[enKey] != null && String(show[enKey]).trim()) return show[enKey];
      }
      return show[base] || '';
    }

    function flushPendingEditableEdits() {
      // Vuelca a proposalState cualquier edición inline aún no persistida.
      // Defensa contra "edito el título y cambio el margen" — el blur del
      // título no se dispara si el slider gana el foco vía click.
      document.querySelectorAll('#proposalContent [contenteditable]').forEach(el => {
        if (!el.dataset) return;
        if (el.dataset.field || el.dataset.showField) {
          if (typeof persistEditableField === 'function') persistEditableField(el);
        } else if (el.dataset.condIndex !== undefined) {
          const i = parseInt(el.dataset.condIndex, 10);
          if (Number.isFinite(i) && typeof updateCondition === 'function') {
            updateCondition(i, el);
          }
        }
      });
    }
    function renderProposal() {
      flushPendingEditableEdits();
      const { client, event, shows, concept, category } = proposalState;
      const catConfig = CATEGORY_CONFIG[category] || CATEGORY_CONFIG.shows;
      const isAdmin = proposalState.isAdmin;

      // Build show blocks HTML
      let showBlocksHTML = '';
      shows.forEach((show, i) => {
        const reversed = i % 2 !== 0;
        const priceWithMargin = getAdjustedPrice(show.currentPrice);
        const priceFormatted = formatPrice(priceWithMargin);

        const imgs = Array.isArray(show.imageUrls) && show.imageUrls.length ? show.imageUrls : (show.imageUrl ? [show.imageUrl] : []);
        const hasCarousel = imgs.length > 1;
        const blockImageHTML = imgs.length === 0
          ? `<div class="block-image block-image--placeholder"></div>`
          : hasCarousel
            ? `<div class="block-image block-carousel" data-carousel-index="${i}">
                ${imgs.map((u, k) => `<div class="carousel-slide ${k === 0 ? 'active' : ''}" style="background-image:url('${u}')"></div>`).join('')}
                <button class="carousel-arrow prev" onclick="carouselStep(${i}, -1)" aria-label="Anterior">‹</button>
                <button class="carousel-arrow next" onclick="carouselStep(${i}, 1)" aria-label="Siguiente">›</button>
                <div class="carousel-dots">
                  ${imgs.map((_, k) => `<button class="carousel-dot ${k === 0 ? 'active' : ''}" onclick="carouselGoto(${i}, ${k})" aria-label="Imagen ${k + 1}"></button>`).join('')}
                </div>
               </div>`
            : `<div class="block-image" style="background-image: url('${imgs[0]}')"></div>`;

        const extras = Array.isArray(show.extras) ? show.extras : [];
        const extrasRowsHTML = extras.map((ex, j) => {
          const exAmount = getAdjustedPrice(ex.amount || 0);
          const exFormatted = formatPrice(exAmount);
          if (isAdmin) {
            return `
              <div class="block-extras-row editable">
                <span class="ex-label" contenteditable="true"
                      onblur="updateExtraLabel(${i}, ${j}, this)"
                      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${ex.label || ''}</span>
                <span class="ex-amount" contenteditable="true"
                      onblur="updateExtraAmount(${i}, ${j}, this)"
                      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}">${exFormatted}&euro;</span>
                <button class="ex-remove" onclick="removeExtra(${i}, ${j})" title="Eliminar línea">&times;</button>
              </div>`;
          }
          return `
              <div class="block-extras-row">
                <span class="ex-label">${ex.label || ''}</span>
                <span class="ex-amount">${exFormatted}&euro;</span>
              </div>`;
        }).join('');
        const extrasBlock = (extras.length || isAdmin) ? `
            <div class="block-extras">
              ${extrasRowsHTML}
              ${isAdmin ? `<button class="block-extras-add" onclick="addExtra(${i})">+ A&ntilde;adir l&iacute;nea de coste</button>` : ''}
            </div>` : '';

        showBlocksHTML += `
          <div class="block ${reversed ? 'block--reversed' : ''} ${isAdmin ? 'admin-mode' : ''}" data-show="${show.id}" data-index="${i}">
            ${isAdmin ? `<button class="block-remove" onclick="removeShow(${i})" title="Eliminar show">&times;</button>` : ''}
            ${blockImageHTML}
            <div class="block-content">
              <div class="section-label ${isAdmin ? 'editable-text' : ''}" ${isAdmin ? `contenteditable="true" data-show-field="contextLabel" data-show-index="${i}"` : ''}>${show.contextLabel}</div>
              <h2 ${isAdmin ? `class="editable-text" contenteditable="true" data-show-field="${LANG === 'en' ? 'nameEn' : 'name'}" data-show-index="${i}"` : ''}>${localizedShowField(show, 'name')}</h2>
              <p ${isAdmin ? `class="editable-text" contenteditable="true" data-show-field="${LANG === 'en' ? 'descriptionEn' : 'description'}" data-show-index="${i}"` : ''}>${localizedShowField(show, 'description')}</p>
              <div class="block-footer">
                <div class="block-price ${isAdmin ? 'editable' : ''}" data-price="${priceWithMargin}" data-index="${i}" ${isAdmin ? 'onclick="startPriceEdit(this, ' + i + ')"' : ''}>
                  ${priceFormatted}&euro;<small ${isAdmin ? `class="editable-text" contenteditable="true" data-show-field="${LANG === 'en' ? 'priceNoteEn' : 'priceNote'}" data-show-index="${i}" onclick="event.stopPropagation()"` : ''}>${localizedShowField(show, 'priceNote')}</small>
                </div>
                ${show.videoUrl ? `<a href="${show.videoUrl.replace('/embed/', '/watch?v=')}" target="_blank" class="btn-dark">${T.btnVideo}</a>` : ''}
              </div>
              ${extrasBlock}
            </div>
          </div>
        `;
      });

      // Build summary rows
      let summaryHTML = '';
      let total = 0;
      shows.forEach(show => {
        const price = getAdjustedPrice(show.currentPrice);
        total += price;
        summaryHTML += `
          <div class="summary-row" data-summary="${show.id}">
            <span>${localizedShowField(show, 'name')} (${localizedShowField(show, 'priceNote')})</span>
            <span>${formatPrice(price)}&euro;</span>
          </div>
        `;
        const extras = Array.isArray(show.extras) ? show.extras : [];
        extras.forEach(ex => {
          const exAmount = getAdjustedPrice(ex.amount || 0);
          total += exAmount;
          summaryHTML += `
          <div class="summary-row summary-row-extra" data-summary="${show.id}-extra">
            <span>${ex.label || ''}</span>
            <span>${formatPrice(exAmount)}&euro;</span>
          </div>
        `;
        });
      });

      // Resuelve campo i18n-aware: en EN usa el override *En del state,
      // sino fallback al catConfig EN; en ES usa el campo base del state,
      // sino fallback al catConfig ES. Permite que el toggle EN funcione
      // sobre propuestas que tienen overrides escritos en ES.
      const heroSubField = LANG === 'en' ? 'heroSubEn' : 'heroSub';
      const conceptTitleField = LANG === 'en' ? 'titleEn' : 'title';
      const conceptTextField = LANG === 'en' ? 'textEn' : 'text';
      const heroSubValue = (proposalState[heroSubField] && String(proposalState[heroSubField]).trim())
        ? proposalState[heroSubField]
        : catConfig.heroSub;
      const conceptTitleValue = (concept[conceptTitleField] && String(concept[conceptTitleField]).trim())
        ? concept[conceptTitleField]
        : (catConfig.conceptTitle || '');
      const conceptTextValue = (concept[conceptTextField] && String(concept[conceptTextField]).trim())
        ? concept[conceptTextField]
        : (catConfig.conceptText || '');

      // Full HTML
      const html = `
        <!-- HERO -->
        <div class="hero">
          <div class="hero-bg-image" style="background-image: url('${proposalState.heroImageUrl || (shows[0] && shows[0].imageUrl) || catConfig.defaultImage}')"></div>
          <div class="nav">
            <div class="nav-logo">
              <img src="https://www.eventosbarcelona.com/wp-content/uploads/2025/03/logo-slogan-negativo.svg" alt="Eventos Barcelona">
            </div>
            <div class="nav-right">
              ${isAdmin
                ? `<button class="hero-image-change" onclick="openHeroImagePicker()">Cambiar imagen</button>`
                : `${clientPdfBtn()}<button id="ctaConfirmBtnTop" class="btn-approve-client" onclick="confirmProposalByEmail()">${T.ctaConfirm}</button>`}
            </div>
          </div>
          <h1 ${isAdmin ? 'class="editable-text" contenteditable="true" data-field="event.name"' : ''}>${event.name.replace(' — ', '<br>')}</h1>
          <p class="hero-sub ${isAdmin ? 'editable-text' : ''}" ${isAdmin ? `contenteditable="true" data-field="${heroSubField}"` : ''}>${escapeHtmlText(heroSubValue)}</p>
          <p class="hero-detail">${event.date} &middot; ${event.type}</p>
        </div>

        <!-- CONCEPTO -->
        <div class="concept-section">
          <div class="section-label">${T.conceptLabel}</div>
          <h2 ${isAdmin ? `class="editable-text" contenteditable="true" data-field="concept.${conceptTitleField}"` : ''}>${escapeHtmlText(conceptTitleValue)}</h2>
          <p ${isAdmin ? `class="editable-text" contenteditable="true" data-field="concept.${conceptTextField}"` : ''}>${escapeHtmlText(conceptTextValue)}</p>
        </div>

        <!-- SHOW BLOCKS -->
        ${showBlocksHTML}

        ${isAdmin ? `
        <div class="add-show-block" onclick="openPicker()">
          <div class="add-show-icon">+</div>
          <h3>Agregar show</h3>
          <p>Selecciona un show del catálogo para agregarlo a la propuesta</p>
        </div>
        ` : ''}

        <!-- RESUMEN PRESUPUESTO -->
        ${proposalState.hideSummary ? (isAdmin ? `
        <div class="add-show-block" onclick="toggleSummary()">
          <div class="add-show-icon">+</div>
          <h3>Mostrar resumen del presupuesto</h3>
          <p>El bloque de precios está oculto en la propuesta del cliente</p>
        </div>
        ` : '') : `
        <div class="summary-section ${isAdmin ? 'admin-mode' : ''}">
          ${isAdmin ? `<button class="summary-remove" onclick="toggleSummary()" title="Ocultar resumen">&times;</button>` : ''}
          <div class="summary-inner">
            <div class="section-label">${T.summaryLabel}</div>
            <div style="margin-top: 24px;" id="summaryRows">
              ${summaryHTML}
              <div class="summary-total" id="summaryTotal">
                <span>${T.summaryTotal}</span>
                <span>${formatPrice(total)}&euro;</span>

            <div class="summary-note">
              ${T.summaryNote1}<br>

            <!-- MARGIN CONTROL (admin only) -->

        <!-- ABOUT -->
        <div class="about-section">

        <!-- CLIENTES / PRUEBA SOCIAL -->
        <div class="clients-section">
          <span class="section-label">${T.clientsTitle}</span>
          <div class="clients-grid">
            ${CLIENT_LOGOS.map((url, i) => `<img src="${url}" alt="Cliente ${i + 1}" loading="lazy">`).join('')}
          </div>

        <!-- CONDICIONES -->
        <div class="conditions-section">
          <div class="section-label">${T.conditionsLabel}</div>
          <ul id="conditionsList">
            ${getActiveConditions().map((c, i) => `
              <li${isAdmin ? ' class="editable-li"' : ''}>
                <span ${isAdmin ? 'class="editable-text" contenteditable="true" data-cond-index="' + i + '" onblur="updateCondition(' + i + ', this)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"' : ''}>${escapeHtmlText(c)}</span>
                ${isAdmin ? `<button class="cond-remove" onclick="removeCondition(${i})" title="Eliminar condición">&times;</button>` : ''}
              </li>
            `).join('')}
          </ul>
          ${isAdmin ? `<button class="cond-add" onclick="addCondition()">+ Añadir condición</button>` : ''}
        </div>

        <!-- CTA FINAL -->
        <div class="cta-section">
          <h2>${catConfig.ctaTitle}</h2>
          <p>${T.ctaSub}</p>

            <button id="ctaConfirmBtn" class="btn-approve-client large" onclick="confirmProposalByEmail()">${T.ctaConfirm}</button>
            ${clientPdfBtn('large')}
          </div>

        <!-- FOOTER -->
        <div class="footer">
          <div class="footer-logo">

          <div class="footer-contact">

            <a href="tel:+34931980265">+34 931 980 265</a>

      document.getElementById('proposalContent').innerHTML = html;
